name: Bug report
description: Report incorrect behavior or a regression
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets. For vulnerabilities, follow SECURITY.md.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Hermes SDD, Hermes Agent, OS, and Python versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal commands, state, and project setup needed to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: `hermes sdd doctor --json`
      render: json
